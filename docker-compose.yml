networks:
  dfls-mesh:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:

services:
  # =========================================================================
  # INFRASTRUCTURE CORE SERVICES
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: dfls-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - dfls-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: dfls-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dfls-mesh
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dfls-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://dfls-kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@dfls-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - dfls-mesh

  # =========================================================================
  # APPLICATION MICROSERVICES
  # =========================================================================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args:
        MODULE_NAME: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./tools/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - TRANSFER_SERVICE_URL=http://transfer-service:8082
      - ACCOUNT_SERVICE_URL=http://account-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_TRACES_EXPORTER=logging
      - OTEL_LOGS_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - GATEWAY_SECRET=${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
    networks:
      - dfls-mesh

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
      args:
        MODULE_NAME: identity-service
    container_name: identity-service
    ports:
      - "8081:8081"
    volumes:
      - ./tools/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=identity-service
      - OTEL_TRACES_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dfls_identity
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=dfls-kafka:29092
      - GATEWAY_SECRET=${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dfls-mesh

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
      args:
        MODULE_NAME: transfer-service
    container_name: transfer-service
    ports:
      - "8082:8082"
    volumes:
      - ./tools/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=transfer-service
      - OTEL_TRACES_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dfls_transfer
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=dfls-kafka:29092
      - SERVICES_ACCOUNT_SERVICE_URL=http://account-service:8083
      - GATEWAY_SECRET=${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      - APP_SCHEDULING_ENABLE=true
      - APP_SECURITY_INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN:?Set INTERNAL_SECRET_TOKEN in .env}
      - SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_JSON_FORMAT_MAPPER=jackson
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dfls-mesh

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
      args:
        MODULE_NAME: account-service
    container_name: account-service
    ports:
      - "8083:8083"
    volumes:
      - ./tools/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=account-service
      - OTEL_TRACES_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dfls_account
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=dfls-kafka:29092
      - APP_SCHEDULING_ENABLE=true
      - APP_SECURITY_INTERNAL_SECRET_TOKEN=${INTERNAL_SECRET_TOKEN:?Set INTERNAL_SECRET_TOKEN in .env}
      - SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_JSON_FORMAT_MAPPER=jackson
      - GATEWAY_SECRET=${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dfls-mesh

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      args:
        MODULE_NAME: notification-service
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=dfls-kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - dfls-mesh

  # =========================================================================
  # OBSERVABILITY & MANAGEMENT DASHBOARDS
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: dfls-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - dfls-mesh

  grafana:
    image: grafana/grafana:10.4.1
    container_name: dfls-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - dfls-mesh