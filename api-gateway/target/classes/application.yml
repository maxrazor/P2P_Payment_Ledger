server:
  port: 8080 # The public entry point for your entire ecosystem

logging:
  level:
    "[org.springframework.cloud.gateway]": INFO
    "[org.springframework.http.server.reactive]": INFO
    "[reactor.netty]": INFO
    "[com.dfls.api_gateway.filter]": DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{trace_id:-}] [%X{span_id:-}] [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never

spring:
  application:
    name: api-gateway

  profiles:
    active: dev

  reactor:
    context-propagation: AUTO
  
  cloud:
    gateway:
      server:
        webflux:

          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

          routes:

            - id: identity-service-me-route
              uri: "${IDENTITY_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/v1/auth/me
              filters:
                - name: AuthenticationFilter
                  args: {}

            - id: identity-service-route
              uri: "${IDENTITY_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET:$2a$12$rCmDdT9GlGwITpiElVRaPu7UR8rvtV2YcdZg/eOZwJ1mqDm9Bci3m}

            - id: transfer-service-route
              uri: "${TRANSFER_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/v1/transfers/**
              filters:
                - name: AuthenticationFilter
                  args: {}
                - name: CircuitBreaker
                  args:
                    name: transferService
                    fallbackUri: forward:/fallback/transfer

            - id: account-service-route
              uri: "${ACCOUNT_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/api/v1/accounts/**
              filters:
                - name: AuthenticationFilter
                  args: {}
                - name: CircuitBreaker
                  args:
                    name: accountService
                    fallbackUri: forward:/fallback/account

            - id: notification-service
              uri: "${NOTIFICATION_SERVICE_URL:http://localhost:8084}"
              predicates:
                - Path=/api/v1/notifications/**
              metadata:
                response-timeout: -1
              filters:
                - name: AuthenticationFilter
                  args: {}

          globalcors:
            add-to-simple-url-handler-mapping: true 
            cors-configurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-Idempotency-Key
                allowCredentials: true

jwt:
  secret: ${JWT_SECRET:KEOV4/OPGCA17SThgUh5WDNUpqgazP0VZ7jWtyWc+o8=}
  expiration: ${JWT_EXPIRATION:86400000}

gateway:
  secret: ${GATEWAY_SECRET:$2a$12$rCmDdT9GlGwITpiElVRaPu7UR8rvtV2YcdZg/eOZwJ1mqDm9Bci3m}

resilience4j:
  circuitbreaker:
    instances:

      accountService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      transferService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3