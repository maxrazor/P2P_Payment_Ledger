spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true # Optional: handy for debugging test queries
    properties:
      # Fixes the Jackson 3 'tools.jackson' deserialization error natively
      # by telling Hibernate to automatically look for any object mappers on your classpath
      "[hibernate.type.json_format_mapper]": org.hibernate.type.format.jackson.JacksonJsonFormatMapper

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dfls_account}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:weoW#$EOGIJHWt&34jto3pwij}
    driver-class-name: org.postgresql.Driver

  kafka:
    listener:
      auto-startup: false
    consumer:
      group-id: "dummy-test-group" # Satisfies the missing group.id validation
    properties:
      "[max.block.ms]": 500         # Prevents your test app from hanging on startup
      "[request.timeout.ms]": 500

  jackson:
    visibility:
      field: any
      getter: none
      setter: none

