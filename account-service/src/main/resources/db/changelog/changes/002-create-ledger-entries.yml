databaseChangeLog:

  - changeSet:
      id: 002-create-ledger-entries
      author: maxim

      changes:

        - createTable:
            tableName: ledger_entries

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: transaction_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: entry_type
                  type: VARCHAR(6)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(18,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

        - createIndex:
            tableName: ledger_entries
            indexName: idx_ledger_account_created
            columns:
              - column:
                  name: account_id
              - column:
                  name: created_at

        - createIndex:
            tableName: ledger_entries
            indexName: idx_ledger_transaction
            columns:
              - column:
                  name: transaction_id