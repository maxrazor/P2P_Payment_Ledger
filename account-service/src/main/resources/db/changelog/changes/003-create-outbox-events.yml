databaseChangeLog:

  - changeSet:
      id: 003-create-outbox-events
      author: maxim

      changes:

        - createTable:
            tableName: outbox_events

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: locked_until
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: attempt_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: last_error
                  type: TEXT

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_status_created
            columns:
              - column:
                  name: status
              - column:
                  name: created_at