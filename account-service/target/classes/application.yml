server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

spring:
  application:
    name: account-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-service-group # Collects instances into a load-balanced consumer pool
      auto-offset-reset: earliest     # Read from the beginning if a brand new group boots up
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # ⚠️ CRITICAL FINTECH SAFETY CHECK:
        # Tell Spring it is safe to deserialize Java classes located inside your shared package path
        '[spring.json.trusted.packages]': "com.dfls.shared.event"

  datasource:
    url: jdbc:postgresql://localhost:5432/dfls_account
    username: postgres
    password: weoW#$EOGIJHWt&34jto3pwij
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect