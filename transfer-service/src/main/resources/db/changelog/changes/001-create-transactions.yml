databaseChangeLog:

  - changeSet:
      id: 001-create-transactions
      author: maxim

      changes:

        - createTable:
            tableName: transactions

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: "gen_random_uuid()"

              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: source_account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: destination_account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(18,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: transactions
            indexName: idx_transactions_sender_created
            columns:
              - column:
                  name: source_account_id
              - column:
                  name: created_at

        - addUniqueConstraint:
            tableName: transactions
            columnNames: idempotency_key
            constraintName: uk_transactions_idempotency_key