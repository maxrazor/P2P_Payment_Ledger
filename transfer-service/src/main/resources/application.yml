server:
  port: 8082

gateway:
  secret: ${GATEWAY_SECRET:$$2a$$12$$rCmDdT9GlGwITpiElVRaPu7UR8rvtV2YcdZg/eOZwJ1mqDm9Bci3m}

services:
  account-service:
    url: ${SERVICES_ACCOUNT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never

spring:
  application:
    name: transfer-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:mytestpassword}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    properties:
      '[retry.backoff.ms]': 1000
      '[reconnect.backoff.ms]': 1000
      
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest 
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        '[spring.deserializer.key.delegate.class]': org.apache.kafka.common.serialization.StringDeserializer
        '[spring.deserializer.value.delegate.class]': org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        '[spring.json.add.type.headers]': true
        '[spring.json.trusted.packages]': "*"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dfls_account}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:weoW#$EOGIJHWt&34jto3pwij}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml

app:
  kafka:
    topics:
      transfer-requests: ${TRANSFER_REQUESTS_TOPIC:transfer-requests-topic}

  security:
    internal-secret-token: ${INTERNAL_SECRET_TOKEN:8c284055dbb54b7f053a2dc612c3727c7aa36354361055f2110f4903ea8ee29c}