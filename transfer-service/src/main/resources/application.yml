server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

spring:
  application:
    name: transfer-service

  kafka:
    bootstrap-servers: localhost:9092 # Point to your Docker container [5]
    producer:
      # Converts the lookup key to a standard String format
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Converts your Java DTOs/Records automatically into clean JSON strings
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://localhost:5432/dfls_transfer
    username: postgres
    password: weoW#$EOGIJHWt&34jto3pwij
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect