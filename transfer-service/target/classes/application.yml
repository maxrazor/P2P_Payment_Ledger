server:
  port: 8082

gateway:
  secret: '$2a$12$rCmDdT9GlGwITpiElVRaPu7UR8rvtV2YcdZg/eOZwJ1mqDm9Bci3m'

services:
  account-service:
    url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

spring:
  application:
    name: transfer-service

  data:
    redis:
      host: localhost             # Change to 'localhost' if running locally
      port: 6379                  # Default Redis port
      password: "mytestpassword"   # The absolute password required by your server

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # This serializes your JsonNode directly into a JSON bytes payload
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      group-id: account-service-group # Collects instances into a load-balanced consumer pool
      auto-offset-reset: earliest     # Read from the beginning if a brand new group boots up
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Instructs the serializer NOT to send type mappings in the message headers
        '[spring.json.add.type.headers]': true
        '[spring.json.trusted.packages]': "*"

  datasource:
    url: jdbc:postgresql://localhost:5432/dfls_transfer
    username: postgres
    password: weoW#$EOGIJHWt&34jto3pwij
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect